<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor">

        <h1>Formulario de Nombres</h1>

        <form method="POST">

            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1">

            <br><br>

            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2">

            <br><br>

            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3">

            <br><br>

            <button type="submit">Enviar</button>

            {% if nombre_mayor %}

                <p>El nombre con mayor cantidad de caracteres
                es: {{ nombre_mayor }}</p>
                <p>El nombre tiene: {{ cantidad }}
                caracteres</p>
            {% endif %}
        </form>
    </div>

</body>
</html>
